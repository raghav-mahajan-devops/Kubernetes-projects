apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  namespace: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
        - name: notes-app
          image: raghavdevops10/notes-app:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi

          env:
            - name: DJANGO_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,notes-svc,ec2-13-204-85-238.ap-south-1.compute.amazonaws.com"
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
