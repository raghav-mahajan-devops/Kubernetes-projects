kind: Deployment
apiVersion: apps/v1

metadata:
  name: raghav-deployment
  namespace: nginx
  labels:
    app: nginx

spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      name: nginx
      labels:
        app: nginx
    spec:
      containers:
      - name: raghav-nginx
        image: nginx:latest
        ports:
        - containerPort: 80
    
