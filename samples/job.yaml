kind: Job
apiVersion: batch/v1

metadata:
  name: raghav-job
  namespace: nginx
spec:
  completions: 1
  parallelism: 1
  template:
    metadata:
      name: demo-job
      labels:
        app: job
    spec:
      containers: 
      - name: batch-container
        image: busybox:latest
        command: ["sh","-c","echo Hello Raghav && sleep 20"]
      restartPolicy: Never
