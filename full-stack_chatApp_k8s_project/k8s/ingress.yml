apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  namespace: chatapp
  labels:
    app.kubernetes.io/name: myingress
spec:
  rules:
  - host: chatapp.com
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: frontend
            port: 
              number: 80

      - pathType: Prefix
        path: "/api"
        backend:
          service:
            name: backend
            port: 
              number: 5001    
