kind: Pod
apiVersion: v1
metadata:
  name: sidecar-cont

spec:
  containers:
    - name: main-container
      image: busybox:latest
      command: ["sh","-c","while true; do echo 'hello raghav' >> /var/log/log.txt; sleep 10; done"]
      volumeMounts:
        - name: storage
          mountPath: /var/log/
    - name: side-car-container
      image: busybox:latest
      command: ["sh","-c","tail -f /var/log/log.txt"]
      volumeMounts:
        - name: storage
          mountPath: /var/log
  volumes:
    - name: storage
      emptyDir: {}
